services:
  # GPU версия - кастомный образ с NeMo
  triton-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: triton-asr-server
    
    shm_size: 32g
    ulimits:
      memlock: -1
      stack: 67108864
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_LAUNCH_BLOCKING=0
      - OMP_NUM_THREADS=4
    
    volumes:
      # Model repository (для обновления config.pbtxt без пересборки)
      - ./model_repository/streaming_asr:/models/streaming_asr:ro
      # NeMo модель (путь к модели в проекте)
      - /home/vlad/streaming_asr_server/kazakh_russian_clean_1024_new_wer_17.nemo:/models/model.nemo:ro
      # Кэш для ускорения загрузки
      - ~/.cache:/root/.cache
    
    ports:
      - "8000:8000"   # HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # Metrics (Prometheus)
    
    command: >
      tritonserver 
      --model-repository=/models
      --strict-model-config=false
      --log-verbose=1
      --backend-config=python,shm-default-byte-size=134217728
      --rate-limit=execution_count
      --rate-limit-resource=gpu:0:4
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    
    restart: unless-stopped

  # CPU версия (без GPU) - кастомный образ с NeMo
  triton-server-cpu:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: triton-asr-server-cpu
    
    shm_size: 8g
    
    network_mode: host
    
    environment:
      - OMP_NUM_THREADS=4
    
    volumes:
      - /home/vlad/streaming_asr_server/kazakh_russian_clean_1024_new_wer_17.nemo:/models/model.nemo:ro
      - ~/.cache:/root/.cache
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    
    profiles:
      - cpu

  # Клиент для тестирования
  triton-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: triton-asr-client
    
    volumes:
      - ../client/audio:/app/audio:ro
    
    network_mode: host
    
    profiles:
      - client
    
    # Пример: docker compose --profile client run --rm triton-client --audio /app/audio/test.wav
