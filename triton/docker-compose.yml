services:
  triton-server:
    image: nvcr.io/nvidia/tritonserver:24.07-py3
    container_name: triton-asr-server
    
    shm_size: 16g
    ulimits:
      memlock: -1
      stack: 67108864
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    volumes:
      # Model repository
      - ./model_repository:/models
      # NeMo модель
      - /home/vlad/nemo/kazakh_russian_clean_1024_new_wer_17.nemo:/models/model.nemo:ro
      # Кэш для ускорения загрузки
      - ~/.cache:/root/.cache
    
    ports:
      - "8000:8000"   # HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # Metrics (Prometheus)
    
    command: >
      tritonserver 
      --model-repository=/models
      --strict-model-config=false
      --log-verbose=1
      --backend-config=python,shm-default-byte-size=16777216
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    
    restart: unless-stopped

  # CPU версия (без GPU)
  triton-server-cpu:
    image: nvcr.io/nvidia/tritonserver:24.07-py3
    container_name: triton-asr-server-cpu
    
    shm_size: 8g
    
    volumes:
      - ./model_repository:/models
      - /home/vlad/nemo/kazakh_russian_clean_1024_new_wer_17.nemo:/models/model.nemo:ro
      - ~/.cache:/root/.cache
    
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    
    command: >
      tritonserver 
      --model-repository=/models
      --strict-model-config=false
      --log-verbose=1
      --backend-config=python,shm-default-byte-size=16777216
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    
    profiles:
      - cpu

  # Клиент для тестирования
  triton-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: triton-asr-client
    
    volumes:
      - ../client/audio:/app/audio:ro
    
    network_mode: host
    
    profiles:
      - client
    
    # Пример: docker compose --profile client run --rm triton-client --audio /app/audio/test.wav

