[project]
name = "streaming-asr-server"
version = "1.0.0"
description = "Streaming ASR Server based on NeMo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
nemo = [
    "torch>=2.3.0",
    "nemo-toolkit[asr]>=2.5.3",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

